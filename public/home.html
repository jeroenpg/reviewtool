<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reviews</title>
<link rel="icon" href="/favicon.svg">
<style>
  :root { --bg: #f6f7f7; --panel: #fff; --ink: #1c2422; --muted: #5d6966; --line: #e2e6e5; --accent: #0e6b61; --pin: #e8590c; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121615; --panel: #1b2120; --ink: #e6ecea; --muted: #9aa7a4; --line: #2c3533; --accent: #3fb5a5; --pin: #ff8a3d; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
  main { max-width: 860px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p { color: var(--muted); margin: 0 0 20px; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
  a.card { display: grid; grid-template-columns: 1fr auto; gap: 2px 16px; padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; color: inherit; text-decoration: none; }
  a.card:hover { border-color: var(--accent); }
  .title { font-weight: 600; }
  .meta { color: var(--muted); font-size: 12px; }
  .open { color: #fff; background: var(--pin); border-radius: 9px; padding: 0 8px; font-size: 12px; font-weight: 700; align-self: center; grid-row: span 2; }
  code { font: 12px ui-monospace, monospace; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }
</style>
</head>
<body>
<main>
  <h1>Reviews</h1>
  <p>Rounds of screenshots to comment on. Agents add rounds with <code>reviewtool round</code> and answer here.</p>
  <ul id="list"></ul>
</main>
<script>
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
async function load() {
  const reviews = await (await fetch('/api/reviews')).json();
  document.getElementById('list').innerHTML = reviews.length ? reviews.map((r) => `
    <li><a class="card" href="/r/${encodeURIComponent(r.slug)}">
      <span class="title">${esc(r.title)}</span>
      ${r.open ? `<span class="open" title="threads waiting for the agent">${r.open} waiting</span>` : '<span></span>'}
      <span class="meta">${r.rounds} round${r.rounds === 1 ? '' : 's'} · ${r.pages} pages${r.repo && r.pr ? ` · ${esc(r.repo)}#${r.pr}` : ''}${r.updatedAt ? ` · updated ${new Date(r.updatedAt).toLocaleString(undefined, { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}` : ''}</span>
    </a></li>`).join('') : '<li class="meta">No reviews yet. Start one with <code>reviewtool init &lt;name&gt;</code>.</li>';
}
load();
setInterval(() => { if (!document.hidden) load().catch(() => {}); }, 10000);
</script>
</body>
</html>
