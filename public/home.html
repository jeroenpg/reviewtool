<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reviews</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/vendor/pico.zinc.min.css">
<link rel="stylesheet" href="/app.css">
<style>
  main.container { max-width: 820px; padding-block: 2rem 4rem; }
  .head { display: flex; align-items: center; gap: .6rem; margin-bottom: 1.25rem; }
  .head img { width: 26px; height: 26px; }
  .head h1 { font-size: 1.4rem; margin: 0; }
  .list { display: grid; gap: .6rem; }
  a.review { display: grid; grid-template-columns: 1fr auto; gap: .2rem 1rem; align-items: center; padding: .85rem 1rem; border: 1px solid var(--pico-muted-border-color); border-radius: var(--pico-border-radius); text-decoration: none; color: inherit; }
  a.review:hover { border-color: var(--pico-primary); }
  a.review strong { font-size: 1.05em; }
  a.review .meta { font-size: .88em; color: var(--pico-muted-color); }
  a.review .status { grid-row: span 2; font-size: .88em; text-align: right; }
  a.review .status.waiting { color: var(--approve); font-weight: 600; }
  a.review .status.open { color: var(--pin); font-weight: 600; }
  a.review progress { grid-column: 1 / -1; margin: .35rem 0 0; height: .3rem; }
  .empty { text-align: center; padding: 3rem 1rem; border: 1px dashed var(--pico-muted-border-color); border-radius: var(--pico-border-radius); color: var(--pico-muted-color); }
</style>
</head>
<body>
<main class="container">
  <div class="head"><img src="/favicon.svg" alt=""><h1>Reviews</h1></div>
  <div class="list" id="list"></div>
</main>
<script>
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const ago = (iso) => {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 60) return `${m} min ago`;
  if (m < 60 * 36) return `${Math.round(m / 60)} h ago`;
  return new Date(iso).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
};
async function load() {
  const reviews = await (await fetch('/api/reviews')).json();
  document.getElementById('list').innerHTML = reviews.length ? reviews.map((r) => {
    const v = r.verdicts || { approve: 0, update: 0, revert: 0 };
    const judged = v.approve + v.update + v.revert;
    const status = r.waiting ? `<span class="status waiting">${esc(r.waiting.by)} is waiting for you</span>`
      : r.open ? `<span class="status open">${r.open} waiting for the agent</span>`
      : r.target?.kind === 't3' ? `<span class="status">Sends to T3: ${esc(r.target.title || 'thread')}</span>`
      : '<span class="status"></span>';
    return `<a class="review" href="/r/${encodeURIComponent(r.slug)}">
      <strong>${esc(r.title)}</strong>${status}
      <span class="meta">Round ${r.rounds} · ${judged}/${r.pages} judged${r.repo && r.pr ? ` · ${esc(r.repo)}#${r.pr}` : ''}${r.updatedAt ? ` · ${ago(r.updatedAt)}` : ''}</span>
      <progress value="${judged}" max="${Math.max(1, r.pages)}"></progress>
    </a>`;
  }).join('') : '<div class="empty">No reviews yet. An agent starts one with <code>reviewtool init &lt;name&gt;</code>.</div>';
}
load();
setInterval(() => { if (!document.hidden) load().catch(() => {}); }, 10000);
</script>
</body>
</html>
